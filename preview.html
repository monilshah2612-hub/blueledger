<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1650c8">
<title>BlueLedger</title>
<style>:root {
  --b900: #0a2a66; --b800: #0f3a8f; --b700: #1650c8; --b600: #1e63e9; --b500: #2f80ed; --b400: #5aa0ff; --b300: #93c1ff; --b100: #dbe9ff; --b50: #eef4ff;
  --bg: #eef4ff; --card: #ffffff; --text: #0f2342; --muted: #6b7fa3; --line: #e1eaf8;
  --income: #0d9488; --expense: #e5484d; --transfer: #2f80ed;
  --shadow: 0 2px 10px rgba(22, 80, 200, .10);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #08142b; --card: #0f2247; --text: #e8f0ff; --muted: #8ea6d1; --line: #1a3361; --income: #2dd4bf; --expense: #ff7a7f; --b50: #0c1d3f; --b100: #16315f; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; }
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.in { color: var(--income); } .ex { color: var(--expense); } .tr { color: var(--transfer); }
.svg { width: 22px; height: 22px; display: block; }

#app { display: flex; flex-direction: column; height: 100%; }
#topbar { background: linear-gradient(160deg, var(--b600), var(--b800)); color: #fff; padding: calc(var(--safe-top) + 8px) 14px 12px; border-radius: 0 0 22px 22px; box-shadow: 0 6px 18px rgba(15, 58, 143, .25); z-index: 5; }
.tb-row { display: flex; align-items: center; gap: 4px; min-height: 44px; }
.tb-title { font-size: 22px; font-weight: 700; flex: 1; }
.tb-month { font-size: 19px; font-weight: 700; padding: 6px 10px; border-radius: 12px; }
.tb-right { margin-left: auto; display: flex; gap: 4px; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: inherit; }
.ib:active { background: rgba(255, 255, 255, .18); }
.page .ib:active, .sheet .ib:active { background: var(--b100); }

.seg { display: flex; background: rgba(255, 255, 255, .16); border-radius: 14px; padding: 3px; margin: 6px 0 10px; }
.seg button { flex: 1; padding: 8px 4px; border-radius: 11px; font-weight: 600; font-size: 14px; opacity: .85; }
.seg button.on { background: #fff; color: var(--b700); opacity: 1; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.sheet .seg, .page .seg, #screen .seg { background: var(--b100); }
.sheet .seg button, .page .seg button, #screen .seg button { color: var(--muted); }
.sheet .seg button.on, .page .seg button.on, #screen .seg button.on { background: var(--card); color: var(--b700); }
.sheet .seg button.on.exp { color: var(--expense); } .sheet .seg button.on.inc { color: var(--income); }
.filters { display: flex; gap: 8px; margin-bottom: 10px; }
.pill { background: rgba(255, 255, 255, .18); color: #fff; border: 0; border-radius: 20px; padding: 6px 12px; font-weight: 600; max-width: 100%; }
.pill option { color: #000; }
.searchbox { width: 100%; border: 0; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; background: rgba(255, 255, 255, .95); color: #0f2342; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sumcard { background: rgba(255, 255, 255, .16); border-radius: 14px; padding: 8px 6px; text-align: center; }
.sumcard.bal { background: #fff; color: var(--b700); }
.sumcard small { display: block; font-size: 12px; opacity: .85; font-weight: 600; }
.sumcard b { display: block; font-size: 14px; margin-top: 2px; word-break: break-all; }
.sumcard.bal small { color: var(--muted); }

#screen { flex: 1; overflow-y: auto; padding: 14px 12px calc(150px + var(--safe-bot)); -webkit-overflow-scrolling: touch; }
.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card h4 { margin: 0 0 10px; font-size: 15px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .big { font-size: 46px; }
.section-t { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 4px 8px; }

.fab { position: fixed; right: 18px; bottom: calc(78px + var(--safe-bot)); width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(145deg, var(--b500), var(--b700)); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(22, 80, 200, .45); z-index: 6; }
.fab svg { width: 28px; height: 28px; }
.fab:active { transform: scale(.94); }
#bottomnav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); box-shadow: 0 -4px 18px rgba(22, 80, 200, .12); padding: 6px 4px calc(6px + var(--safe-bot)); z-index: 5; border-radius: 20px 20px 0 0; }
#bottomnav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 14px; }
#bottomnav button.on { color: var(--b600); }
#bottomnav button.on .svg { stroke-width: 2.4; }

/* rows */
.daygroup { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.dayhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--b50); border-bottom: 1px solid var(--line); }
.dnum { font-size: 22px; font-weight: 800; color: var(--b700); min-width: 30px; }
.dmeta { font-size: 12px; color: var(--muted); font-weight: 600; }
.chip { display: inline-block; background: var(--b600); color: #fff; border-radius: 8px; padding: 1px 7px; margin-right: 4px; font-size: 11px; }
.dtot { margin-left: auto; text-align: right; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--b50); }
.ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; flex: none; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-note { color: var(--muted); font-weight: 400; }
.dot { margin: 0 4px; color: var(--muted); }
.row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt { font-weight: 700; white-space: nowrap; }
.amt.in { color: var(--income); } .amt.ex { color: var(--expense); } .amt.tr { color: var(--transfer); }

/* calendar */
.cal { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 8px; margin-bottom: 12px; }
.cal-h, .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-h div { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 0; }
.cal-h div:last-child { color: var(--b600); }
.cell { min-height: 62px; border-radius: 10px; padding: 3px 3px 2px; background: var(--b50); overflow: hidden; }
.cell.off { opacity: .35; }
.cell.sel { outline: 2px solid var(--b600); background: var(--b100); }
.cell.today .cn { background: var(--b600); color: #fff; border-radius: 8px; padding: 0 5px; display: inline-block; }
.cn { font-size: 12px; font-weight: 700; margin-bottom: 1px; }
.cell div:not(.cn) { font-size: 9.5px; font-weight: 700; line-height: 1.25; text-align: right; }
.cell .ci { color: var(--income); } .cell .ce { color: var(--expense); } .cell .cb { color: var(--muted); }
.day-panel-h { display: flex; align-items: center; gap: 8px; margin: 4px 4px 8px; }
.day-panel-h b { flex: 1; }

/* monthly table */
.mrow { display: grid; grid-template-columns: 54px 1fr 1fr 1fr; gap: 6px; padding: 11px 6px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: center; }
.mrow.h { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.mrow span:not(:first-child) { text-align: right; }
.mrow.cur { background: var(--b50); border-radius: 10px; }

/* budget */
.env { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
.env-top { display: flex; align-items: center; gap: 12px; }
.env-name { font-weight: 700; flex: 1; }
.env-left { font-weight: 800; font-size: 15px; }
.bar { height: 10px; background: var(--b100); border-radius: 8px; overflow: hidden; margin: 10px 0 6px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--b400), var(--b600)); border-radius: 8px; }
.bar.warn > i { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.bar.over > i { background: linear-gradient(90deg, #ff8a8f, var(--expense)); }
.env-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.hero { background: linear-gradient(150deg, var(--b500), var(--b800)); color: #fff; border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(22, 80, 200, .3); }
.hero small { opacity: .8; font-weight: 600; }
.hero .big { font-size: 28px; font-weight: 800; margin: 2px 0 8px; }
.hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12px; }
.hero-grid b { display: block; font-size: 14px; }

/* reports */
.donut { width: 180px; height: 180px; display: block; margin: 0 auto; transform: rotate(0deg); }
.dt1 { font-size: 3.4px; text-anchor: middle; fill: var(--muted); font-weight: 600; }
.dt2 { font-size: 4.6px; text-anchor: middle; fill: var(--text); font-weight: 800; }
.leg { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 14px; }
.leg i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.leg span { flex: 1; } .leg em { font-style: normal; color: var(--muted); font-size: 12px; margin-right: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--card); border-radius: 16px; padding: 10px 8px; text-align: center; box-shadow: var(--shadow); }
.stat small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
.stat b { font-size: 14px; }
.bars text { font-size: 9px; fill: var(--muted); text-anchor: middle; }

/* menu */
.menu-item { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--card); border-radius: 16px; margin-bottom: 8px; box-shadow: var(--shadow); width: 100%; text-align: left; }
.menu-item .ico { width: 42px; height: 42px; }
.menu-item b { display: block; } .menu-item small { color: var(--muted); }

/* sheets & pages */
#sheetRoot { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#sheetRoot.open { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: rgba(5, 20, 50, .5); animation: fade .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 8px 16px calc(18px + var(--safe-bot)); animation: up .22s ease-out; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 8px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-h h3 { margin: 0; font-size: 18px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.page { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
.page-h { display: flex; align-items: center; gap: 6px; padding: calc(var(--safe-top) + 8px) 10px 10px; background: linear-gradient(160deg, var(--b600), var(--b800)); color: #fff; border-radius: 0 0 22px 22px; }
.page-h h2 { margin: 0; font-size: 20px; flex: 1; }
.page-b { flex: 1; overflow-y: auto; padding: 14px 12px calc(40px + var(--safe-bot)); }

label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; text-transform: uppercase; letter-spacing: .4px; }
.inp, select.inp, textarea.inp { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--b50); outline: none; }
.inp:focus { border-color: var(--b500); background: var(--card); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amt-box { display: flex; align-items: center; gap: 8px; background: var(--b50); border: 1.5px solid var(--line); border-radius: 18px; padding: 8px 16px; margin: 4px 0 4px; }
.amt-box span { font-size: 28px; font-weight: 700; color: var(--b600); }
.amt-box input { flex: 1; min-width: 0; font-size: 34px; font-weight: 800; border: 0; background: none; outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cchip { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 20px; background: var(--b50); border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; }
.cchip.sel { background: var(--b600); border-color: var(--b600); color: #fff; }
.cchip.dis { opacity: .4; pointer-events: none; }
.cchip.add { border-style: dashed; color: var(--b600); }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; }
.swatch.sel { border-color: var(--text); }
.emo { width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px; border-radius: 12px; background: var(--b50); border: 1.5px solid transparent; }
.emo.sel { border-color: var(--b600); background: var(--b100); }
.btn { padding: 14px; border-radius: 16px; font-weight: 700; flex: 1; text-align: center; }
.btn.primary { background: linear-gradient(145deg, var(--b500), var(--b700)); color: #fff; box-shadow: 0 6px 14px rgba(22, 80, 200, .3); }
.btn.ghost { background: var(--b100); color: var(--b700); }
.btn.danger { background: #fde8e9; color: var(--expense); }
.btn.block { display: block; width: 100%; margin-top: 12px; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.tog { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; gap: 12px; }
.tog input { width: 44px; height: 24px; accent-color: var(--b600); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 2px 8px; background: var(--b100); color: var(--b700); }
.badge.red { background: #fde8e9; color: var(--expense); } .badge.green { background: #d9f5f1; color: var(--income); }

#toast { position: fixed; left: 50%; bottom: calc(150px + var(--safe-bot)); transform: translate(-50%, 20px); background: #0a2a66; color: #fff; padding: 11px 16px; border-radius: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 80; max-width: 88%; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { margin-left: 10px; color: var(--b300); font-weight: 800; }

/* wizard + lock */
.wizard, .lock { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.wz-top { background: linear-gradient(160deg, var(--b600), var(--b900)); color: #fff; padding: calc(var(--safe-top) + 22px) 20px 26px; border-radius: 0 0 28px 28px; }
.wz-top h1 { margin: 6px 0 4px; font-size: 26px; } .wz-top p { margin: 0; opacity: .85; }
.dots { display: flex; gap: 6px; } .dots i { height: 5px; flex: 1; background: rgba(255, 255, 255, .3); border-radius: 4px; } .dots i.on { background: #fff; }
.wz-body { flex: 1; overflow-y: auto; padding: 16px 16px 10px; }
.wz-foot { padding: 10px 16px calc(14px + var(--safe-bot)); display: flex; gap: 10px; background: var(--bg); }
.acc-edit { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
.lock { align-items: center; justify-content: center; background: linear-gradient(160deg, var(--b600), var(--b900)); color: #fff; text-align: center; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 20px 0; } .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; } .pin-dots i.on { background: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; justify-content: center; }
.keypad button { height: 64px; border-radius: 50%; background: rgba(255, 255, 255, .15); font-size: 24px; font-weight: 600; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="screen"></main>
  <button id="fab" class="fab" data-act="addTx" aria-label="Add transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav id="bottomnav"></nav>
</div>
<div id="page" class="page hidden"></div>
<div id="sheetRoot"></div>
<div id="wizard" class="wizard hidden"></div>
<div id="lock" class="lock hidden"></div>
<div id="toast"></div>
<script>'use strict';
window.App = window.App || {};
(function (App) {
  var KEY = 'blueledger.v1';
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); };
  var today = function () { return ymd(new Date()); };
  var r2 = function (n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; };
  var uid = function () { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var nf = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fmt = function (n) { return nf.format(r2(n)); };
  var money = function (n) {
    n = r2(n);
    return (n < 0 ? '-' : '') + App.db.settings.currency + nf.format(Math.abs(n));
  };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var monthLabel = function (mk) { var p = mk.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; };
  var shiftMonth = function (mk, n) {
    var p = mk.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  };
  var dateLabel = function (s) {
    var d = parse(s);
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  };
  var shortDate = function (s) { var d = parse(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  Object.assign(App, { $: $, $$: $$, pad: pad, ymd: ymd, parse: parse, today: today, r2: r2, uid: uid, esc: esc,
    fmt: fmt, money: money, MONTHS: MONTHS, DAYS: DAYS, monthLabel: monthLabel, shiftMonth: shiftMonth,
    dateLabel: dateLabel, shortDate: shortDate });

  // ---------- constants ----------
  App.COLORS = ['#1e63e9', '#2f80ed', '#0ea5e9', '#06b6d4', '#3b5bdb', '#4f46e5', '#14b8a6', '#22c55e', '#f59e0b', '#f97316', '#ef4444', '#ec4899', '#8b5cf6', '#64748b'];
  App.EMOJIS = ['🍔', '🛒', '🚌', '⛽', '🏠', '💡', '📱', '🛍️', '💊', '🎬', '✈️', '🎓', '🔁', '💈', '🎁', '📈', '🏦', '🏷️', '💼', '💻', '🏪', '💰', '↩️', '☕', '🍕', '🚕', '🚗', '🏋️', '🐶', '👶', '🎮', '📚', '🧾', '🔧', '🎉', '🌴', '💳', '🪙', '🧴', '🍺'];
  App.SUG_EXP = [['Food & Dining', '🍔'], ['Groceries', '🛒'], ['Transport', '🚌'], ['Fuel', '⛽'], ['Rent', '🏠'], ['Bills & Utilities', '💡'], ['Mobile & Internet', '📱'], ['Shopping', '🛍️'], ['Health', '💊'], ['Entertainment', '🎬'], ['Travel', '✈️'], ['Education', '🎓'], ['Subscriptions', '🔁'], ['Personal Care', '💈'], ['Gifts & Donations', '🎁'], ['Investments', '📈'], ['EMI / Loans', '🏦'], ['Others', '🏷️']];
  App.SUG_INC = [['Salary', '💼'], ['Freelance', '💻'], ['Business', '🏪'], ['Interest', '🏦'], ['Rental Income', '🏠'], ['Gifts', '🎁'], ['Refunds', '↩️'], ['Others', '💰']];

  App.renderScreen = function () {

  // ---------- shared row ----------
  App.txRow = function (t, showDate) {

    var ico = isT ? '🔁' : (t.loanId ? '🤝' : (c ? c.icon : '🏷️'));
    var color = isT ? '#2f80ed' : (c ? c.color : '#94a3b8');
    var title = isT ? 'Transfer' : (c ? c.name : (t.loanId ? 'Loan' : 'Uncategorised'));
    var a = App.acc(t.accountId), to = App.acc(t.toAccountId);
    var sub = isT ? (a ? esc(a.name) : '?') + ' → ' + (to ? esc(to.name) : '?') : (a ? esc(a.name) : '');
    if (showDate) sub += ' · ' + App.shortDate(t.date);
    var cls = isT ? 'tr' : (t.type === 'income' ? 'in' : 'ex');

      '<div class="row-main"><div class="row-title">' + esc(title) + (t.note ? '<span class="dot">·</span><span class="row-note">' + esc(t.note) + '</span>' : '') + '</div><div class="row-sub">' + sub + '</div></div>' +

  function empty(emoji, text) { return '<div class="empty"><div class="big">' + emoji + '</div><p>' + text + '</p></div>'; }

  // ---------- HOME ----------
  function renderHome() {
    var u = App.ui;

  }
  function searchResults() {

    }).slice(0, 100);
    if (!list.length) return empty('🔍', 'No matching transactions');
    return '<div class="daygroup">' + list.map(function (t) { return App.txRow(t, true); }).join('') + '</div>';
  }
  function dayGroups(list) {
    var g = {}, order = [];
    list.forEach(function (t) { if (!g[t.date]) { g[t.date] = []; order.push(t.date); } g[t.date].push(t); });
    return order.map(function (d) {
      var dt = App.parse(d), inc = 0, exp = 0;
      g[d].forEach(function (t) { if (t.type === 'income') inc += t.amount; else if (t.type === 'expense') exp += t.amount; });

        '<div class="dtot">' + (inc ? '<span class="in">+' + money(inc) + '</span>' : '') + (exp ? '<span class="ex">-' + money(exp) + '</span>' : '') + '</div></div>' +
        g[d].map(function (t) { return App.txRow(t); }).join('') + '</section>';
    }).join('');
  }
  function renderDaily() {
    var list = App.txIn(App.ui.month, App.ui.acc);

  }
  var cf = function (n) {
    n = Math.abs(n);
    if (n >= 1e7) return (n / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr';
    if (n >= 1e5) return (n / 1e5).toFixed(1).replace(/\.0$/, '') + 'L';
    if (n >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n));
  };
  function renderCalendar() {
    var u = App.ui, mk = u.month, p = mk.split('-').map(Number);
    fixSel();
    var list = App.txIn(mk, u.acc), agg = {};
    list.forEach(function (t) {
      if (t.type === 'transfer') return;
      if (u.acc !== 'all' && t.accountId !== u.acc) return;
      var a = agg[t.date] || (agg[t.date] = { i: 0, e: 0 });
      if (t.type === 'income') a.i += t.amount; else a.e += t.amount;
    });
    var first = new Date(p[0], p[1] - 1, 1), off = (first.getDay() + 6) % 7, days = new Date(p[0], p[1], 0).getDate();
    var total = Math.ceil((off + days) / 7) * 7, today = App.today();
    var h = '<div class="cal"><div class="cal-h">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) { return '<div>' + d + '</div>'; }).join('') + '</div><div class="cal-g">';
    for (var i = 0; i < total; i++) {
      var dt = new Date(p[0], p[1] - 1, 1 - off + i), key = App.ymd(dt), inMonth = dt.getMonth() === p[1] - 1;
      if (!inMonth) { h += '<div class="cell off"><div class="cn">' + dt.getDate() + '</div></div>'; continue; }

        (a ? (a.i ? '<div class="ci">' + cf(a.i) + '</div>' : '') + (a.e ? '<div class="ce">' + cf(a.e) + '</div>' : '') + '<div class="cb">' + (net < 0 ? '-' : '') + cf(net) + '</div>' : '') + '</div>';

    h += day.length ? '<div class="daygroup">' + day.map(function (t) { return App.txRow(t); }).join('') + '</div>' : '<div class="empty" style="padding:20px">Nothing recorded on this day</div>';

  App.actions.addTxOn = function (el) { App.openTx({ date: el.dataset.d }); };

  // ---------- BUDGET (envelopes) ----------

    var items = Object.keys(byCat).map(function (k) {

    }).sort(function (a, b) { return b.v - a.v; });

    var h = '<div class="stats"><div class="stat"><small>Saved</small><b>' + (tt.income > 0 ? Math.round(tt.balance / tt.income * 100) + '%' : '–') + '</b></div><div class="stat"><small>Avg / day</small><b>' + money(tt.expense / days) + '</b></div><div class="stat"><small>Biggest</small><b>' + (biggest ? money(biggest.amount) : '–') + '</b></div></div>';

        items.map(function (it) { return '<div class="leg"><i style="background:' + it.color + '"></i><span>' + it.icon + ' ' + esc(it.name) + '</span><em>' + Math.round(it.v / total * 100) + '%</em><b>' + money(it.v) + '</b></div>'; }).join('') + '</div></div>';

    }).join('');
    h += '<div class="card"><h4>Income vs expenses · 6 months</h4><svg class="bars" viewBox="0 0 320 154" width="100%">' + bars + '</svg><div class="leg" style="justify-content:center;gap:18px"><span style="flex:none"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--income);margin-right:6px"></i>Income</span><span style="flex:none"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--b500);margin-right:6px"></i>Expenses</span></div></div>';

<script>'use strict';
(function (App) {
  var $ = App.$, esc = App.esc, money = App.money, icon = App.icon;

  App.formHelpers = { accOptions: accOptions, swatches: swatches, emojiGrid: emojiGrid, pickedColor: pickedColor, pickedEmoji: pickedEmoji };

  // ---------- TRANSACTION SHEET ----------
  var cur = null;

  App.actions.addTx = function () { App.openTx({}); };

<script>'use strict';
(function (App) {
  var $ = App.$, $$ = App.$$, esc = App.esc, money = App.money, r2 = App.r2, icon = App.icon;

  // ---------- page shell ----------

  App.actions.openPage = function (el) { App.openPage(el.dataset.p); };

  var daysUntil = function (d) { return Math.round((App.parse(d) - App.parse(App.today())) / 864e5); };

  PAGES.bills = function () {

        '<label class="lbl">Title</label><input class="inp" id="b-title" value="' + esc(b.title) + '" placeholder="e.g. Rent, Netflix, Salary" maxlength="40">' +

        '<div class="tog"><span>Add to my records automatically on the due date</span><input type="checkbox" id="b-auto"' + (b.auto ? ' checked' : '') + '></div>' +
        '<div class="btn-row">' + (o.id ? '<button class="btn danger" id="b-del" style="flex:none;padding:14px 18px">' + icon('trash') + '</button>' : '') + '<button class="btn primary" id="b-save">Save</button></div>';

  App.pinPad = function (title, cb, cancellable) {

    el.classList.remove('hidden');
    var draw = function (msg) {

        (cancellable ? '<p><button data-k="x" style="margin-top:18px;color:#cfe0ff;font-weight:700">Cancel</button></p>' : '') + '</div>';

        b.onclick = function () {
          var k = b.dataset.k;
          if (k === 'x') { App.hideLock(); return; }

    var s = App.db.settings;
    if (!s.pin || !s.onboarded) return;
    App.pinPad('Enter PIN', function (pin) { if (hashPin(pin) !== s.pin) return false; App.hideLock(); return true; }, false);
  };

  // ---------- SETUP WIZARD ----------
  var wz = null;
  App.startWizard = function () {
    wz = { step: 0, name: '', currency: '₹', accounts: [], expSel: {}, expCustom: [], incSel: {}, incCustom: [], limits: {}, auto: true, freq: 7, remindBackup: true, reminders: true };
    $('#wizard').classList.remove('hidden');
    drawWz();
  };
  var STEPS = [
    ['Welcome 👋', 'Let\'s set things up your way – it takes about a minute.'],
    ['Your accounts', 'Add every place your money lives: cash, banks, cards, wallets.'],
    ['Your categories', 'Pick what you spend on and earn from. You can add your own.'],
    ['Your envelopes', 'Set a monthly limit for the categories you want to control. Leave blank to skip.'],
    ['Backups & reminders', 'Keep your data safe and never miss a bill.']
  ];
  function readWz() {
    var w = $('#wizard');
    if (wz.step === 0) { wz.name = ($('#w-name', w).value || '').trim(); wz.currency = $('#w-cur', w).value; }
    if (wz.step === 1) {
      wz.accounts = $$('.acc-edit', w).map(function (r) {
        return { name: $('.w-an', r).value.trim(), type: $('.w-at', r).value, opening: $('.w-ao', r).value };
      });
    }
    if (wz.step === 3) { $$('.w-limit', w).forEach(function (i) { wz.limits[i.dataset.n] = i.value; }); }
    if (wz.step === 4) { wz.auto = $('#w-auto', w).checked; wz.freq = +$('#w-freq', w).value; wz.remindBackup = $('#w-rb', w).checked; wz.reminders = $('#w-rem', w).checked; }
  }
  function expNames() { return App.SUG_EXP.map(function (x) { return x[0]; }).concat(wz.expCustom).filter(function (n) { return wz.expSel[n]; }); }
  function chipsFor(t) {
    var sug = t === 'exp' ? App.SUG_EXP : App.SUG_INC, custom = t === 'exp' ? wz.expCustom : wz.incCustom, sel = t === 'exp' ? wz.expSel : wz.incSel;
    var all = sug.map(function (x) { return x[0]; }).concat(custom);
    return '<div class="chips">' + all.map(function (n) {
      var em = (sug.filter(function (x) { return x[0] === n; })[0] || [0, '🏷️'])[1];
      return '<button class="cchip ' + (sel[n] ? 'sel' : '') + '" data-act="wzToggle" data-t="' + t + '" data-n="' + esc(n) + '"><span>' + em + '</span>' + esc(n) + '</button>';
    }).join('') + '</div><div class="two" style="grid-template-columns:1fr auto;margin-top:10px"><input class="inp" id="w-new-' + t + '" placeholder="Add your own…" maxlength="26"><button class="btn ghost" style="flex:none;padding:0 18px" data-act="wzAdd" data-t="' + t + '">Add</button></div>';
  }
  function drawWz() {
    var w = $('#wizard'), s = wz.step, body = '';
    if (s === 0) {
      body = '<label class="lbl">What should we call you?</label><input class="inp" id="w-name" placeholder="Your name" value="' + esc(wz.name) + '" maxlength="30">' +
        '<label class="lbl">Currency</label><select class="inp" id="w-cur">' + ['₹', '$', '€', '£', '¥', 'AED ', 'Rs '].map(function (c) { return '<option value="' + c + '"' + (wz.currency === c ? ' selected' : '') + '>' + c.trim() + '</option>'; }).join('') + '</select>' +
        '<p class="muted" style="margin-top:20px;line-height:1.5">Your data stays on this phone. Nothing is uploaded unless you choose to share a backup.</p>';
    } else if (s === 1) {
      body = '<div class="chips" style="margin-bottom:12px">' + [['Cash', 'cash'], ['Bank account', 'bank'], ['Credit card', 'card'], ['UPI wallet', 'wallet'], ['Savings', 'savings']].map(function (p) { return '<button class="cchip add" data-act="wzAcc" data-n="' + p[0] + '" data-t="' + p[1] + '">+ ' + p[0] + '</button>'; }).join('') + '<button class="cchip add" data-act="wzAcc" data-n="" data-t="bank">+ Other</button></div>' +
        (wz.accounts.length ? wz.accounts.map(function (a, i) {
          return '<div class="acc-edit" data-i="' + i + '"><div class="two" style="grid-template-columns:1fr auto"><input class="inp w-an" placeholder="Account name" value="' + esc(a.name) + '" maxlength="30"><button class="ib" data-act="wzDelAcc" data-i="' + i + '" style="color:var(--expense)">' + icon('trash') + '</button></div><div class="two" style="margin-top:8px"><select class="inp w-at">' + App.ACC_TYPES.map(function (t) { return '<option value="' + t[0] + '"' + (a.type === t[0] ? ' selected' : '') + '>' + t[2] + ' ' + t[1] + '</option>'; }).join('') + '</select><input class="inp w-ao" inputmode="decimal" placeholder="Balance now" value="' + esc(a.opening) + '"></div></div>';
        }).join('') + '<p class="muted" style="font-size:12px">For a credit card you owe money on, enter the balance with a minus sign.</p>' : '<p class="muted">Tap a suggestion above to add your first account.</p>');
    } else if (s === 2) {
      body = '<div class="section-t" style="margin-top:0;display:flex;justify-content:space-between">Spending <button data-act="wzAll" data-t="exp" style="color:var(--b600)">Select all</button></div>' + chipsFor('exp') +
        '<div class="section-t" style="display:flex;justify-content:space-between">Income <button data-act="wzAll" data-t="inc" style="color:var(--b600)">Select all</button></div>' + chipsFor('inc');
    } else if (s === 3) {
      var names = expNames();
      body = names.length ? names.map(function (n) {
        var em = (App.SUG_EXP.filter(function (x) { return x[0] === n; })[0] || [0, '🏷️'])[1];
        return '<div class="acc-edit"><div class="two" style="grid-template-columns:1fr 130px;align-items:center"><b>' + em + ' ' + esc(n) + '</b><input class="inp w-limit" data-n="' + esc(n) + '" inputmode="decimal" placeholder="Monthly limit" value="' + esc(wz.limits[n] || '') + '"></div></div>';
      }).join('') + '<p class="muted" style="font-size:12px">Each limit becomes an envelope that resets every month. You can combine categories into shared envelopes later in the Budget tab.</p>' : '<p class="muted">You did not pick any spending categories, so there is nothing to budget yet. You can create envelopes any time from the Budget tab.</p>';
    } else {
      body = '<div class="card"><div class="tog"><span><b>Automatic backup</b><br><small class="muted">Saves a file on your phone when due</small></span><input type="checkbox" id="w-auto"' + (wz.auto ? ' checked' : '') + '></div>' +
        '<div class="tog"><span>How often</span><select class="inp" style="width:auto" id="w-freq">' + [[1, 'Daily'], [7, 'Weekly'], [30, 'Monthly']].map(function (f) { return '<option value="' + f[0] + '"' + (wz.freq === f[0] ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('') + '</select></div>' +
        '<div class="tog"><span><b>Backup reminder</b><br><small class="muted">Nudge to share a copy to Google Drive</small></span><input type="checkbox" id="w-rb"' + (wz.remindBackup ? ' checked' : '') + '></div>' +
        '<div class="tog"><span><b>Bill reminders</b></span><input type="checkbox" id="w-rem"' + (wz.reminders ? ' checked' : '') + '></div></div>';
    }
    w.innerHTML = '<div class="wz-top"><div class="dots">' + STEPS.map(function (_, i) { return '<i class="' + (i <= s ? 'on' : '') + '"></i>'; }).join('') + '</div><h1>' + STEPS[s][0] + '</h1><p>' + STEPS[s][1] + '</p></div><div class="wz-body">' + body + '</div>' +
      '<div class="wz-foot">' + (s > 0 ? '<button class="btn ghost" data-act="wzBack">Back</button>' : '') + '<button class="btn primary" data-act="wzNext">' + (s === STEPS.length - 1 ? 'Finish' : 'Next') + '</button></div>';
  }
  App.actions.wzAcc = function (el) { readWz(); wz.accounts.push({ name: el.dataset.n, type: el.dataset.t, opening: '' }); drawWz(); };
  App.actions.wzDelAcc = function (el) { readWz(); wz.accounts.splice(+el.dataset.i, 1); drawWz(); };
  App.actions.wzToggle = function (el) {
    var sel = el.dataset.t === 'exp' ? wz.expSel : wz.incSel, n = el.dataset.n;
    sel[n] = !sel[n]; el.classList.toggle('sel', !!sel[n]);
  };
  App.actions.wzAll = function (el) {
    var t = el.dataset.t, sug = t === 'exp' ? App.SUG_EXP : App.SUG_INC, custom = t === 'exp' ? wz.expCustom : wz.incCustom, sel = t === 'exp' ? wz.expSel : wz.incSel;
    sug.map(function (x) { return x[0]; }).concat(custom).forEach(function (n) { sel[n] = true; });
    drawWz();
  };
  App.actions.wzAdd = function (el) {
    var t = el.dataset.t, inp = $('#w-new-' + t), n = inp.value.trim();
    if (!n) return;
    var custom = t === 'exp' ? wz.expCustom : wz.incCustom, sel = t === 'exp' ? wz.expSel : wz.incSel, sug = (t === 'exp' ? App.SUG_EXP : App.SUG_INC).map(function (x) { return x[0]; });
    if (sug.concat(custom).indexOf(n) < 0) custom.push(n);
    sel[n] = true; drawWz();
  };
  App.actions.wzBack = function () { readWz(); wz.step = Math.max(0, wz.step - 1); drawWz(); };
  App.actions.wzNext = function () {
    readWz();
    if (wz.step === 1) {
      var named = wz.accounts.filter(function (a) { return a.name; });
      if (!named.length) { App.toast('Add at least one account with a name'); return; }
      wz.accounts = named;
      for (var i = 0; i < wz.accounts.length; i++) {
        var o = String(wz.accounts[i].opening).trim();
        if (o && isNaN(App.evalAmount(o))) { App.toast('Check the balance for "' + wz.accounts[i].name + '"'); return; }
      }
    }
    if (wz.step < STEPS.length - 1) { wz.step++; drawWz(); var b = $('#wizard .wz-body'); if (b) b.scrollTop = 0; return; }
    finishWz();
  };
  function finishWz() {
    var db = App.blank(), ci = 0, col = function () { return App.COLORS[ci++ % App.COLORS.length]; };
    db.settings.name = wz.name; db.settings.currency = wz.currency; db.settings.autoBackup = wz.auto; db.settings.backupEveryDays = wz.freq;
    db.settings.remindBackup = wz.remindBackup; db.settings.reminders = wz.reminders; db.settings.onboarded = true;
    wz.accounts.forEach(function (a) {
      var o = String(a.opening).trim();
      db.accounts.push({ id: App.uid(), name: a.name, type: a.type, opening: o ? App.evalAmount(o) : 0, color: col() });
    });
    var mk = function (names, type, sug) {
      names.forEach(function (n) {
        var em = (sug.filter(function (x) { return x[0] === n; })[0] || [0, '🏷️'])[1];
        var c = { id: App.uid(), name: n, type: type, icon: em, color: col() };
        db.categories.push(c);
        var lim = type === 'expense' ? App.evalAmount(wz.limits[n] || '') : NaN;
        if (lim > 0) db.envelopes.push({ id: App.uid(), name: n, icon: em, limit: lim, categoryIds: [c.id] });
      });
    };
    mk(expNames(), 'expense', App.SUG_EXP);
    mk(App.SUG_INC.map(function (x) { return x[0]; }).concat(wz.incCustom).filter(function (n) { return wz.incSel[n]; }), 'income', App.SUG_INC);
    App.db = db; App.persist();
    $('#wizard').classList.add('hidden'); $('#wizard').innerHTML = '';
    App.ui.tab = 'home'; App.render();
    App.scheduleReminders(); App.maybeAutoBackup();
    App.toast('All set' + (db.settings.name ? ', ' + db.settings.name : '') + '! Tap + to add your first transaction.');
  }
})(window.App);
</script>
<script>'use strict';
(function (App) {
  var $ = App.$;

  // Returns true if the back press was handled inside the app
  App.back = function () {
    if (!$('#lock').classList.contains('hidden')) return true;
    if (!$('#wizard').classList.contains('hidden')) {
      var b = $('#wizard [data-act="wzBack"]');
      if (b) b.click();
      return true;
    }
    if (App._sheetOpen) { App.closeSheet(); return true; }
    if (App.ui.page) { App.closePage(); return true; }
    if (App.ui.searchOpen) { App.actions.toggleSearch(); return true; }
    if (App.ui.tab !== 'home') { App.setTab('home'); return true; }
    return false;
  };

  function boot() {
    var s = App.db.settings;
    if (!s.onboarded) {
      App.render();
      App.startWizard();
    } else {
      var n = App.processBills();
      App.render();
      App.lockIfNeeded();
      if (n) App.toast('Added ' + n + ' recurring entr' + (n === 1 ? 'y' : 'ies'));
      App.maybeAutoBackup();
      App.scheduleReminders();
    }

    var capApp = App.cap('App');
    if (capApp) {
      capApp.addListener('backButton', function () {
        if (!App.back()) capApp.exitApp();
      });
      var hiddenAt = 0;
      capApp.addListener('appStateChange', function (st) {
        if (!st.isActive) { hiddenAt = Date.now(); return; }
        if (hiddenAt && Date.now() - hiddenAt > 30000) App.lockIfNeeded();
        if (App.db.settings.onboarded) {
          var n = App.processBills();
          if (n) { App.render(); App.toast('Added ' + n + ' recurring entr' + (n === 1 ? 'y' : 'ies')); }
          App.maybeAutoBackup();
        }
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.App);
</script>
</body>
